[project]
name = "aml-assignment"
version = "0.1.0"
description = "COS30082 Assignment 1: fine-grained bird species classification on CUB-200-2010"
# Colab ships its own (older) interpreter, so the code must not rely on 3.14-only features.
requires-python = ">=3.11"
# Core runtime needed on every machine, including Colab (where torch is preinstalled).
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0.20",
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Mac-only work: linear probes, zero-shot text towers, statistics and figures.
local = [
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "open_clip_torch>=2.32",
]
# Gradio front-end (app/), published to the Hugging Face Hub by scripts/publish_app.py.
app = [
    "gradio>=5.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdcls"]

[tool.pytest.ini_options]
testpaths = ["tests"]
